<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <title>ROADBOOK READER - Select File</title>
  
  <link rel="stylesheet" href="src/style.css">
  <!-- Librerie PDF.js e HEIC Conversion per iPhone -->
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.min.js"></script>
</head>
<body class="page-landing">

  <div class="offroad-bg-overlay"></div>

  <main class="offroad-card">
    <div class="offroad-badge">OFF-ROAD NAVIGATION</div>
    
    <h1 class="main-title">
      <span class="title-top">ROADBOOK</span>
      <span class="title-bottom">READER</span>
    </h1>
    
    <p class="subtitle">Carica il file (PDF, PNG, JPG, HEIC) per iniziare il viaggio</p>

    <div class="upload-area">
      <label for="pdf-file-input" class="btn-offroad-primary">
        <span class="btn-icon">📂</span> CARICA FILE ROADBOOK
      </label>
      <input type="file" id="pdf-file-input" accept="application/pdf, image/png, image/jpeg, image/jpg, image/heic, .heic" onchange="loadRoadbook(event)">
      
      <div id="upload-status" class="status-message"></div>
    </div>

    <div class="offroad-decorations">
      <span>TRIP METER</span>
      <span>•</span>
      <span>GPS TRACK</span>
      <span>•</span>
      <span>AUTO-ADVANCE</span>
    </div>

    <footer class="footer-credit">
      Powered by Angelo Martelli
    </footer>
  </main>

  <script src="src/app.js"></script>
</body>
</html>
