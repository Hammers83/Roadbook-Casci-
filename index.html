<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Funzionalità PWA per schermata intera -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <title>Roadbook Trip Master</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100vh;
      padding: 15px;
      user-select: none;
    }
    
    /* SEZIONE TAPPE */
    .stages-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 5px;
    }
    .stage-box {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 10px 12px;
    }
    .stage-current {
      border-left: 5px solid #ffb74d; /* Evidenzia la tappa attiva */
      background-color: #25231f;
    }
    .stage-next {
      border-left: 5px solid #555;
      opacity: 0.8;
    }
    .stage-label {
      font-size: 0.75rem;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .stage-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stage-controls {
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }
    .btn-stage {
      padding: 8px;
      font-size: 0.85rem;
      background-color: #333;
      color: #fff;
      border: 1px solid #444;
      border-radius: 6px;
      flex: 1;
    }

    /* SEZIONE DISPLAY CONTACHILOMETRI */
    .display-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .box {
      background-color: #1e1e1e;
      border: 2px solid #333;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }
    .box-trip {
      border-color: #00e676;
    }
    .label {
      font-size: 0.9rem;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .value {
      font-size: 3.2rem;
      font-weight: bold;
      font-family: monospace;
      margin: 2px 0;
    }
    .unit {
      font-size: 1rem;
      color: #888;
    }

    /* CONTROLLI E PULSANTI */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 5px;
    }
    button {
      padding: 15px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-transform: uppercase;
    }
    .btn-reset-trip {
      background-color: #00e676;
      color: #000;
      font-size: 1.3rem;
    }
    .btn-reset-total {
      background-color: #ff5252;
      color: #fff;
    }
    .btn-toggle {
      background-color: #29b6f6;
      color: #000;
    }
    .status-container {
      text-align: center;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .status-gps {
      color: #ffb74d;
    }
    .status-wakelock {
      color: #888;
    }
  </style>
</head>
<body>

  <!-- NUOVA SEZIONE TAPPE -->
  <div class="stages-container">
    <!-- Tappa Attuale -->
    <div class="stage-box stage-current">
      <div class="stage-label" id="current-stage-num">Tappa Attuale (1/3)</div>
      <div class="stage-title" id="current-stage-name">Partenza ➔ Controllo Tappa 1</div>
    </div>
    
    <!-- Tappa Successiva -->
    <div class="stage-box stage-next">
      <div class="stage-label">Tappa Successiva</div>
      <div class="stage-title" id="next-stage-name">Controllo Tappa 1 ➔ Passo di Montagna</div>
    </div>

    <!-- Selettore Tappe -->
    <div class="stage-controls">
      <button class="btn-stage" onclick="prevStage()">◀ Tappa Prec.</button>
      <button class="btn-stage" onclick="nextStage()">Tappa Succ. ▶</button>
    </div>
  </div>

  <!-- DISPLAY CONTACHILOMETRI -->
  <div class="display-container">
    <div class="box box-trip">
      <div class="label">Trip (Parziale)</div>
      <div class="value" id="trip-dist">0.00</div>
      <div class="unit">KM</div>
    </div>

    <div class="box">
      <div class="label">Totale</div>
      <div class="value" id="total-dist">0.00</div>
      <div class="unit">KM</div>
    </div>
  </div>

  <!-- STATO SENSORI -->
  <div class="status-container">
    <div class="status-gps" id="status-text">In attesa del GPS...</div>
    <div class="status-wakelock" id="wakelock-text">Schermo: Standard</div>
  </div>

  <!-- PULSANTI AZIONE -->
  <div class="controls">
    <button class="btn-reset-trip" onclick="resetTrip()">AZZERA TRIP</button>
    <button class="btn-toggle" id="btn-toggle" onclick="toggleGPS()">Pausa GPS</button>
    <button class="btn-reset-total" onclick="resetTotal()">Azzera Totale</button>
  </div>

  <script>
    // --- LISTA TAPPE PERSONALIZZABILE ---
    const route = [
      "Partenza ➔ Controllo Tappa 1",
      "Controllo Tappa 1 ➔ Passo di Montagna",
      "Passo di Montagna ➔ Bivio Cemento",
      "Bivio Cemento ➔ Arrivo Finale"
    ];
    let currentStageIndex = 0;

    function updateStageDisplay() {
      const currentName = route[currentStageIndex];
      const nextName = (currentStageIndex + 1 < route.length) 
        ? route[currentStageIndex + 1] 
        : "FINE ROADBOOK 🏁";

      document.getElementById("current-stage-num").innerText = `Tappa Attuale (${currentStageIndex + 1}/${route.length})`;
      document.getElementById("current-stage-name").innerText = currentName;
      document.getElementById("next-stage-name").innerText = nextName;
    }

    function nextStage() {
      if (currentStageIndex < route.length - 1) {
        currentStageIndex++;
        updateStageDisplay();
        resetTrip(); // Azzera in automatico il parziale quando passi alla tappa successiva
      }
    }

    function prevStage() {
      if (currentStageIndex > 0) {
        currentStageIndex--;
        updateStageDisplay();
      }
    }

    // --- LOGICA TRIP MASTER E GPS ---
    let totalKm = 0.0;
    let tripKm = 0.0;
    let lastCoords = null;
    let watchId = null;
    let isTracking = false;
    let wakeLock = null;

    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          document.getElementById("wakelock-text").innerText = "Schermo: Sempre Attivo 💡";
          document.getElementById("wakelock-text").style.color = "#00e676";

          wakeLock.addEventListener('release', () => {
            document.getElementById("wakelock-text").innerText = "Schermo: Standard";
            document.getElementById("wakelock-text").style.color = "#888";
          });
        } catch (err) {
          document.getElementById("wakelock-text").innerText = `Schermo: Errore (${err.message})`;
          document.getElementById("wakelock-text").style.color = "#ff5252";
        }
      }
    }

    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release();
        wakeLock = null;
      }
    }

    document.addEventListener('visibilitychange', async () => {
      if (wakeLock !== null && document.visibilityState === 'visible' && isTracking) {
        await requestWakeLock();
      }
    });

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function handlePosition(position) {
      const { latitude, longitude, accuracy } = position.coords;

      document.getElementById("status-text").innerText = `GPS Attivo (Accuratezza: ±${Math.round(accuracy)}m)`;
      document.getElementById("status-text").style.color = "#00e676";

      if (lastCoords) {
        const dist = calculateDistance(lastCoords.latitude, lastCoords.longitude, latitude, longitude);
        if (dist > 0.005 && accuracy < 30) {
          totalKm += dist;
          tripKm += dist;
          updateDisplays();
          lastCoords = { latitude, longitude };
        }
      } else {
        lastCoords = { latitude, longitude };
      }
    }

    function handleError(error) {
      document.getElementById("status-text").innerText = "Errore GPS: " + error.message;
      document.getElementById("status-text").style.color = "#ff5252";
    }

    async function toggleGPS() {
      const btn = document.getElementById("btn-toggle");
      if (!isTracking) {
        if ("geolocation" in navigator) {
          watchId = navigator.geolocation.watchPosition(handlePosition, handleError, {
            enableHighAccuracy: true,
            maximumAge: 1000,
            timeout: 10000
          });
          isTracking = true;
          btn.innerText = "Pausa GPS";
          btn.style.backgroundColor = "#ffb74d";
          await requestWakeLock();
        } else {
          alert("La geolocalizzazione non è supportata dal tuo browser.");
        }
      } else {
        navigator.geolocation.clearWatch(watchId);
        isTracking = false;
        lastCoords = null;
        btn.innerText = "Avvia GPS";
        btn.style.backgroundColor = "#29b6f6";
        document.getElementById("status-text").innerText = "GPS In pausa";
        document.getElementById("status-text").style.color = "#ffb74d";
        releaseWakeLock();
      }
    }

    function updateDisplays() {
      document.getElementById("total-dist").innerText = totalKm.toFixed(2);
      document.getElementById("trip-dist").innerText = tripKm.toFixed(2);
    }

    function resetTrip() {
      tripKm = 0.0;
      updateDisplays();
    }

    function resetTotal() {
      if (confirm("Vuoi davvero azzerare il chilometraggio totale?")) {
        totalKm = 0.0;
        tripKm = 0.0;
        updateDisplays();
      }
    }

    // AVVIO AUTOMATICO ALL'APERTURA
    window.addEventListener('DOMContentLoaded', () => {
      updateStageDisplay();
      toggleGPS();
    });
  </script>
</body>
</html>
