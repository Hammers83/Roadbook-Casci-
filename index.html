<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <title>Roadbook Trip Master</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      user-select: none;
    }

    /* AREA CARICAMENTO E GESTIONE PDF */
    .pdf-upload-box {
      background-color: #1e1e1e;
      border: 1px dashed #555;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      margin-bottom: 8px;
    }
    .pdf-label { font-size: 0.8rem; color: #00e676; display: block; margin-bottom: 6px; font-weight: bold; }
    input[type="file"] { display: none; }
    .pdf-actions {
      display: flex;
      justify-content: center;
      gap: 8px;
    }
    .btn-file {
      display: inline-block;
      padding: 6px 12px;
      background-color: #333;
      color: #fff;
      font-size: 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid #555;
    }
    .btn-clear-pdf {
      display: inline-block;
      padding: 6px 12px;
      background-color: #331515;
      color: #ff5252;
      font-size: 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid #ff5252;
      font-weight: bold;
    }

    .main-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    /* SEZIONE TAPPE CON CASELLA VISIVA */
    .stages-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .stage-box {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 8px 12px;
    }
    .stage-current {
      border-left: 6px solid #ffb74d;
      background-color: #25231f;
    }
    .stage-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* CASELLA VISIVA DIREZIONE */
    .direction-box {
      width: 70px;
      height: 70px;
      background-color: #000;
      border: 2px solid #ffb74d;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      flex-shrink: 0;
    }

    .stage-details { flex: 1; overflow: hidden; }
    .stage-label { font-size: 0.75rem; color: #aaa; text-transform: uppercase; }
    .stage-title {
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      font-weight: bold;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stage-info { font-size: 0.8rem; color: #ffb74d; font-family: monospace; }

    .stage-controls { display: flex; gap: 8px; margin-top: 4px; }
    .btn-stage {
      padding: 10px;
      font-size: 0.9rem;
      background-color: #333;
      color: #fff;
      border: 1px solid #444;
      border-radius: 6px;
      flex: 1;
      font-weight: bold;
      cursor: pointer;
    }

    /* DISPLAY CONTACHILOMETRI */
    .display-container { display: flex; flex-direction: column; gap: 8px; }
    .box {
      background-color: #1e1e1e;
      border: 2px solid #333;
      border-radius: 12px;
      padding: 8px;
      text-align: center;
      flex: 1;
    }
    .box-trip { border-color: #00e676; }
    .label { font-size: 0.8rem; color: #aaa; text-transform: uppercase; }
    .value {
      font-size: clamp(2.8rem, 7.5vw, 5rem);
      font-weight: bold;
      font-family: monospace;
      line-height: 1;
    }
    .unit { font-size: 0.85rem; color: #888; }

    .bottom-section { margin-top: 8px; }
    .btn-reset-trip {
      padding: 16px;
      font-size: 1.3rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-transform: uppercase;
      background-color: #00e676;
      color: #000;
      width: 100%;
    }
    .status-container {
      text-align: center;
      font-size: 0.75rem;
      display: flex;
      justify-content: space-around;
      margin-bottom: 4px;
    }
    .status-gps { color: #ffb74d; }

    @media (min-width: 600px) or (orientation: landscape) {
      .main-grid { display: grid; grid-template-columns: 1fr 1fr; align-items: center; }
      .display-container, .stages-container { height: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

  <!-- CARICAMENTO E PULIZIA MEMORIA PDF -->
  <div class="pdf-upload-box">
    <span class="pdf-label" id="pdf-status">📄 Carica Roadbook PDF</span>
    <div class="pdf-actions">
      <label class="btn-file">
        Sfoglia PDF
        <input type="file" id="pdf-file-input" accept="application/pdf" onchange="loadPDF(event)">
      </label>
      <button class="btn-clear-pdf" onclick="clearPDF()">❌ Rimuovi PDF</button>
    </div>
  </div>

  <div class="main-grid">
    
    <div class="stages-container">
      <div class="stage-box stage-current">
        <div class="stage-label" id="current-stage-num">Nota Attuale (1 / 8)</div>
        <div class="stage-header">
          <!-- CASELLA VISIVA DIREZIONE -->
          <div class="direction-box" id="current-direction-icon">↗️</div>
          <div class="stage-details">
            <div class="stage-title" id="current-stage-name">PER PISTOIA EST</div>
            <div class="stage-info" id="current-stage-target">Target Parz: 0.55 km | Tot: 0.55 km</div>
          </div>
        </div>
      </div>
      
      <div class="stage-box">
        <div class="stage-label">Nota Successiva</div>
        <div class="stage-title" id="next-stage-name">Nota 2: CASELLO</div>
        <div class="stage-info" id="next-stage-target">Target Parz: 0.76 km | Tot: 1.31 km</div>
      </div>

      <div class="stage-controls">
        <button class="btn-stage" onclick="prevStage()">◀ Nota Prec.</button>
        <button class="btn-stage" onclick="nextStage()">Nota Succ. ▶</button>
      </div>
    </div>

    <!-- CONTATORI CHILOMETRICI -->
    <div class="display-container">
      <div class="box box-trip">
        <div class="label">Mancanti al Parziale</div>
        <div class="value" id="trip-countdown">0.55</div>
        <div class="unit">KM</div>
      </div>

      <div class="box">
        <div class="label">Km Totali Percorsi</div>
        <div class="value" id="total-traveled">0.00</div>
        <div class="unit">KM</div>
      </div>
    </div>

  </div>

  <div class="bottom-section">
    <div class="status-container">
      <div class="status-gps" id="status-text">In attesa del GPS...</div>
      <div class="status-wakelock" id="wakelock-text">Schermo: Standard</div>
    </div>
    <button class="btn-reset-trip" onclick="resetTrip()">AZZERA TRIP (AZZERA PARZIALE)</button>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.worker.min.js';

    // Percorso base predefinito
    const defaultRoute = [
      { nota: 1, text: "PER PISTOIA EST", parziale: 0.000, totale: 0.000, icon: "↗️" },
      { nota: 2, text: "CASELLO", parziale: 0.550, totale: 0.550, icon: "⬆️" },
      { nota: 3, text: "PROSEGUI DRITTO", parziale: 0.760, totale: 1.310, icon: "⬆️" },
      { nota: 4, text: "PER PRATO", parziale: 0.390, totale: 1.700, icon: "↘️" },
      { nota: 5, text: "BIVIO", parziale: 2.700, totale: 4.400, icon: "🔀" },
      { nota: 6, text: "X STADIO", parziale: 2.450, totale: 6.850, icon: "❌" },
      { nota: 7, text: "INGRESSO PARCHEGGIO", parziale: 0.420, totale: 7.270, icon: "🅿️" },
      { nota: 8, text: "ARRIVO", parziale: 0.090, totale: 7.360, icon: "🏁" }
    ];

    let route = JSON.parse(JSON.stringify(defaultRoute));
    let currentStageIndex = 0;

    function getDirectionIcon(text) {
      const t = text.toUpperCase();
      if (t.includes("DESTRA") || t.includes("PRATO")) return "↗️";
      if (t.includes("SINISTRA") || t.includes("PISTOIA")) return "↖️";
      if (t.includes("STADIO") || t.includes("X")) return "❌";
      if (t.includes("PARCHEGGIO") || t.includes("PARK")) return "🅿️";
      if (t.includes("ARRIVO") || t.includes("FINE")) return "🏁";
      if (t.includes("CASELLO")) return "🛑";
      return "⬆️";
    }

    // --- CARICAMENTO PDF ---
    async function loadPDF(event) {
      const file = event.target.files[0];
      if (!file || file.type !== "application/pdf") return;

      document.getElementById("pdf-status").innerText = "Lettura PDF in corso...";

      const fileReader = new FileReader();
      fileReader.onload = async function() {
        const typedarray = new Uint8Array(this.result);
        try {
          const pdf = await pdfjsLib.getDocument(typedarray).promise;
          let allItems = [];

          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const textContent = await page.getTextContent();
            const pageItems = textContent.items.map(item => item.str.trim()).filter(str => str.length > 0);
            allItems = allItems.concat(pageItems);
          }

          let extractedStages = [];
          
          for (let i = 0; i < allItems.length; i++) {
            let item = allItems[i];
            
            if (/^\d{1,3}$/.test(item)) {
              let notaNum = parseInt(item);

              if (notaNum > 0 && notaNum < 150) {
                let noteText = "SEGUI STRADA";
                let valuesFound = [];

                for (let j = Math.max(0, i - 4); j < Math.min(allItems.length, i + 6); j++) {
                  let contextItem = allItems[j];
                  
                  if (/[A-Z]{3,}/.test(contextItem) && !contextItem.includes("AUTOSTRADA") && !contextItem.includes("DISTANZE") && !contextItem.includes("LEOPARD")) {
                    noteText = contextItem;
                  }
                  
                  if (/^\d{1,2},\d{3}$/.test(contextItem)) {
                    let val = parseFloat(contextItem.replace(',', '.'));
                    valuesFound.push(val);
                  }
                }

                if (!extractedStages.some(s => s.nota === notaNum)) {
                  let parziale = valuesFound.length > 0 ? valuesFound[0] : 0.0;
                  let totale = valuesFound.length > 1 ? valuesFound[1] : parziale;

                  extractedStages.push({
                    nota: notaNum,
                    text: noteText,
                    parziale: parziale,
                    totale: totale,
                    icon: getDirectionIcon(noteText)
                  });
                }
              }
            }
          }

          if (extractedStages.length > 0) {
            extractedStages.sort((a, b) => a.nota - b.nota);
            route = extractedStages;
            currentStageIndex = 0;
            resetTrip();
            document.getElementById("pdf-status").innerText = `✅ Caricate ${route.length} Note dal PDF!`;
          }
        } catch (err) {
          document.getElementById("pdf-status").innerText = "Errore lettura PDF: " + err.message;
        }
      };

      fileReader.readAsArrayBuffer(file);
    }

    // --- PULIZIA E RESET PDF ---
    function clearPDF() {
      // Resetta l'input del file HTML
      document.getElementById("pdf-file-input").value = "";
      
      // Ripristina la rotta predefinita e azzera gli indici
      route = JSON.parse(JSON.stringify(defaultRoute));
      currentStageIndex = 0;
      
      // Resetta il messaggio di stato e i contatori GPS
      document.getElementById("pdf-status").innerText = "📄 Carica Roadbook PDF";
      resetTrip();
    }

    function updateStageDisplay() {
      const current = route[currentStageIndex];
      const next = (currentStageIndex + 1 < route.length) ? route[currentStageIndex + 1] : null;

      document.getElementById("current-stage-num").innerText = `Nota Attuale (${current.nota} / ${route.length})`;
      document.getElementById("current-stage-name").innerText = current.text;
      document.getElementById("current-direction-icon").innerText = current.icon;
      document.getElementById("current-stage-target").innerText = `Target Parz: ${current.parziale.toFixed(2)} km | Tot: ${current.totale.toFixed(2)} km`;

      if (next) {
        document.getElementById("next-stage-name").innerText = `Nota ${next.nota}: ${next.text}`;
        document.getElementById("next-stage-target").innerText = `Target Parz: ${next.parziale.toFixed(2)} km | Tot: ${next.totale.toFixed(2)} km`;
      } else {
        document.getElementById("next-stage-name").innerText = "FINE ROADBOOK 🏁";
        document.getElementById("next-stage-target").innerText = "-";
      }

      updateDisplays();
    }

    function nextStage() {
      if (currentStageIndex < route.length - 1) {
        currentStageIndex++;
        resetTrip();
      }
    }

    function prevStage() {
      if (currentStageIndex > 0) {
        currentStageIndex--;
        updateStageDisplay();
      }
    }

    let totalKmTraveled = 0.0;
    let tripKmTraveled = 0.0;
    let lastCoords = null;
    let watchId = null;
    let wakeLock = null;

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function handlePosition(position) {
      const { latitude, longitude, accuracy } = position.coords;

      document.getElementById("status-text").innerText = `GPS: ±${Math.round(accuracy)}m`;
      document.getElementById("status-text").style.color = "#00e676";

      if (lastCoords) {
        const dist = calculateDistance(lastCoords.latitude, lastCoords.longitude, latitude, longitude);
        if (dist > 0.003 && accuracy < 30) {
          totalKmTraveled += dist;
          tripKmTraveled += dist;
          updateDisplays();
          lastCoords = { latitude, longitude };
        }
      } else {
        lastCoords = { latitude, longitude };
      }
    }

    function updateDisplays() {
      const current = route[currentStageIndex];

      let remainingTrip = current.parziale - tripKmTraveled;
      if (remainingTrip < 0) remainingTrip = 0;

      document.getElementById("trip-countdown").innerText = remainingTrip.toFixed(2);
      document.getElementById("total-traveled").innerText = totalKmTraveled.toFixed(2);
    }

    function resetTrip() {
      tripKmTraveled = 0.0;
      updateStageDisplay();
    }

    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          document.getElementById("wakelock-text").innerText = "Schermo: Attivo 💡";
          document.getElementById("wakelock-text").style.color = "#00e676";
        } catch (err) {}
      }
    }

    function startGPS() {
      if ("geolocation" in navigator) {
        watchId = navigator.geolocation.watchPosition(handlePosition, (err) => {
          document.getElementById("status-text").innerText = "Errore GPS: " + err.message;
        }, {
          enableHighAccuracy: true,
          maximumAge: 1000,
          timeout: 10000
        });
        requestWakeLock();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      updateStageDisplay();
      startGPS();
    });
  </script>
</body>
</html>
