<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <title>ROADBOOK READER - Caricamento</title>
  
  <link rel="stylesheet" href="src/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.min.js"></script>
</head>
<body class="page-landing">

  <div class="offroad-bg-overlay"></div>
  
  <div class="landing-card offroad-card">
    <div class="offroad-badge">RALLY & NAVIGATION</div>
    
    <h1 class="main-title">
      <span class="title-top">ROADBOOK</span>
      <span class="title-bottom">READER</span>
    </h1>
    
    <p class="subtitle">Carica il file (PDF) e comincia il viaggio.</p>
    
    <div class="upload-area">
      <label class="btn-offroad-primary">
        <span class="btn-icon">📁</span>
        <span>CARICA ROADBOOK PDF</span>
        <input type="file" id="pdf-file-input" accept="application/pdf" onchange="loadPDF(event)">
      </label>
      <span id="upload-status" class="status-message"></span>
    </div>

    <div class="offroad-decorations">
      <span>● GPS READY</span>
      <span>● TRIP ODOMETER</span>
    </div>
    
    <div class="footer-credit">Powered by Angelo Martelli</div>
  </div>

  <script src="src/app.js"></script>
</body>
</html>
