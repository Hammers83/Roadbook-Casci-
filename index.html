<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <title>Roadbook Trip Master</title>
  
  <!-- Libreria PDF.js per la lettura dei file PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      user-select: none;
    }

    /* CARICA FILE PDF */
    .pdf-upload-box {
      background-color: #1e1e1e;
      border: 1px dashed #555;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      margin-bottom: 10px;
    }
    .pdf-label {
      font-size: 0.85rem;
      color: #00e676;
      display: block;
      margin-bottom: 4px;
      font-weight: bold;
    }
    input[type="file"] { display: none; }
    .btn-file {
      display: inline-block;
      padding: 6px 14px;
      background-color: #333;
      color: #fff;
      font-size: 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid #555;
    }

    /* CONTENITORE PRINCIPALE GRID RESPONSIVE */
    .main-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    /* SEZIONE TAPPE */
    .stages-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .stage-box {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 10px 14px;
    }
    .stage-current {
      border-left: 6px solid #ffb74d;
      background-color: #25231f;
    }
    .stage-next {
      border-left: 6px solid #555;
      opacity: 0.8;
    }
    .stage-label {
      font-size: 0.75rem;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .stage-title {
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      font-weight: bold;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stage-controls {
      display: flex;
      gap: 8px;
    }
    .btn-stage {
      padding: 10px;
      font-size: 0.9rem;
      background-color: #333;
      color: #fff;
      border: 1px solid #444;
      border-radius: 6px;
      flex: 1;
      font-weight: bold;
      cursor: pointer;
    }

    /* SEZIONE DISPLAY CONTACHILOMETRI */
    .display-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .box {
      background-color: #1e1e1e;
      border: 2px solid #333;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      flex: 1;
    }
    .box-trip {
      border-color: #00e676;
    }
    .label {
      font-size: 0.85rem;
      color: #aaa;
      text-transform: uppercase;
    }
    .value {
      font-size: clamp(3rem, 8vw, 5.5rem);
      font-weight: bold;
      font-family: monospace;
      margin: 0;
      line-height: 1.1;
    }
    .unit {
      font-size: 0.9rem;
      color: #888;
    }

    /* CONTROLLI IN BASSO */
    .bottom-section {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .controls {
      display: flex;
      flex-direction: column;
    }
    .btn-reset-trip {
      padding: 18px;
      font-size: 1.4rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-transform: uppercase;
      background-color: #00e676;
      color: #000;
      width: 100%;
    }
    .status-container {
      text-align: center;
      font-size: 0.75rem;
      display: flex;
      justify-content: space-around;
      margin-bottom: 4px;
    }
    .status-gps { color: #ffb74d; }
    .status-wakelock { color: #888; }

    /* LAYOUT SPECIFICO PER TABLET O SMARTPHONE IN ORIZZONTALE */
    @media (min-width: 600px) or (orientation: landscape) {
      .main-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: center;
      }
      .display-container {
        height: 100%;
        justify-content: center;
      }
      .stages-container {
        height: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <!-- CARICA FILE PDF -->
  <div class="pdf-upload-box">
    <span class="pdf-label" id="pdf-status">📄 Carica Roadbook da file PDF</span>
    <label class="btn-file">
      Sfoglia PDF
      <input type="file" id="pdf-file-input" accept="application/pdf" onchange="loadPDF(event)">
    </label>
  </div>

  <!-- GRIGLIA PRINCIPALE -->
  <div class="main-grid">
    
    <!-- SEZIONE TAPPE -->
    <div class="stages-container">
      <div class="stage-box stage-current">
        <div class="stage-label" id="current-stage-num">Tappa Attuale (1/4)</div>
        <div class="stage-title" id="current-stage-name">Partenza ➔ Controllo Tappa 1</div>
      </div>
      
      <div class="stage-box stage-next">
        <div class="stage-label">Tappa Successiva</div>
        <div class="stage-title" id="next-stage-name">Controllo Tappa 1 ➔ Passo di Montagna</div>
      </div>

      <div class="stage-controls">
        <button class="btn-stage" onclick="prevStage()">◀ Tappa Prec.</button>
        <button class="btn-stage" onclick="nextStage()">Tappa Succ. ▶</button>
      </div>
    </div>

    <!-- DISPLAY CONTACHILOMETRI -->
    <div class="display-container">
      <div class="box box-trip">
        <div class="label">Trip (Parziale)</div>
        <div class="value" id="trip-dist">0.00</div>
        <div class="unit">KM</div>
      </div>

      <div class="box">
        <div class="label">Totale</div>
        <div class="value" id="total-dist">0.00</div>
        <div class="unit">KM</div>
      </div>
    </div>

  </div>

  <!-- CONTROLLI E STATO -->
  <div class="bottom-section">
    <div class="status-container">
      <div class="status-gps" id="status-text">In attesa del GPS...</div>
      <div class="status-wakelock" id="wakelock-text">Schermo: Standard</div>
    </div>

    <div class="controls">
      <button class="btn-reset-trip" onclick="resetTrip()">AZZERA TRIP</button>
    </div>
  </div>

  <script>
    // Configurazione PDF.js
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.worker.min.js';

    let route = [
      "Partenza ➔ Controllo Tappa 1",
      "Controllo Tappa 1 ➔ Passo di Montagna",
      "Passo di Montagna ➔ Bivio Cemento",
      "Bivio Cemento ➔ Arrivo Finale"
    ];
    let currentStageIndex = 0;

    // --- PARSER PDF ---
    async function loadPDF(event) {
      const file = event.target.files[0];
      if (!file || file.type !== "application/pdf") return;

      document.getElementById("pdf-status").innerText = "Elaborazione PDF in corso...";

      const fileReader = new FileReader();
      fileReader.onload = async function() {
        const typedarray = new Uint8Array(this.result);

        try {
          const pdf = await pdfjsLib.getDocument(typedarray).promise;
          let extractedLines = [];

          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const textContent = await page.getTextContent();
            let pageLines = textContent.items
              .map(item => item.str.trim())
              .filter(str => str.length > 2);

            extractedLines = extractedLines.concat(pageLines);
          }

          if (extractedLines.length > 0) {
            route = extractedLines;
            currentStageIndex = 0;
            updateStageDisplay();
            document.getElementById("pdf-status").innerText = `✅ PDF Caricato (${route.length} tappe estratte)`;
          } else {
            document.getElementById("pdf-status").innerText = "⚠️ Nessun testo rilevato nel PDF";
          }
        } catch (err) {
          document.getElementById("pdf-status").innerText = "Errore lettura PDF: " + err.message;
        }
      };

      fileReader.readAsArrayBuffer(file);
    }

    // --- GESTIONE TAPPE ---
    function updateStageDisplay() {
      const currentName = route[currentStageIndex];
      const nextName = (currentStageIndex + 1 < route.length) 
        ? route[currentStageIndex + 1] 
        : "FINE ROADBOOK 🏁";

      document.getElementById("current-stage-num").innerText = `Tappa Attuale (${currentStageIndex + 1}/${route.length})`;
      document.getElementById("current-stage-name").innerText = currentName;
      document.getElementById("next-stage-name").innerText = nextName;
    }

    function nextStage() {
      if (currentStageIndex < route.length - 1) {
        currentStageIndex++;
        updateStageDisplay();
        resetTrip();
      }
    }

    function prevStage() {
      if (currentStageIndex > 0) {
        currentStageIndex--;
        updateStageDisplay();
      }
    }

    // --- LOGICA GPS E WAKE LOCK ---
    let totalKm = 0.0;
    let tripKm = 0.0;
    let lastCoords = null;
    let watchId = null;
    let wakeLock = null;

    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          document.getElementById("wakelock-text").innerText = "Schermo: Attivo 💡";
          document.getElementById("wakelock-text").style.color = "#00e676";

          wakeLock.addEventListener('release', () => {
            document.getElementById("wakelock-text").innerText = "Schermo: Standard";
            document.getElementById("wakelock-text").style.color = "#888";
          });
        } catch (err) {}
      }
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function handlePosition(position) {
      const { latitude, longitude, accuracy } = position.coords;

      document.getElementById("status-text").innerText = `GPS: ±${Math.round(accuracy)}m`;
      document.getElementById("status-text").style.color = "#00e676";

      if (lastCoords) {
        const dist = calculateDistance(lastCoords.latitude, lastCoords.longitude, latitude, longitude);
        if (dist > 0.005 && accuracy < 30) {
          totalKm += dist;
          tripKm += dist;
          updateDisplays();
          lastCoords = { latitude, longitude };
        }
      } else {
        lastCoords = { latitude, longitude };
      }
    }

    function handleError(error) {
      document.getElementById("status-text").innerText = "Errore GPS: " + error.message;
      document.getElementById("status-text").style.color = "#ff5252";
    }

    async function startGPS() {
      if ("geolocation" in navigator) {
        watchId = navigator.geolocation.watchPosition(handlePosition, handleError, {
          enableHighAccuracy: true,
          maximumAge: 1000,
          timeout: 10000
        });
        await requestWakeLock();
      } else {
        alert("La geolocalizzazione non è supportata dal tuo browser.");
      }
    }

    function updateDisplays() {
      document.getElementById("total-dist").innerText = totalKm.toFixed(2);
      document.getElementById("trip-dist").innerText = tripKm.toFixed(2);
    }

    function resetTrip() {
      tripKm = 0.0;
      updateDisplays();
    }

    window.addEventListener('DOMContentLoaded', () => {
      updateStageDisplay();
      startGPS();
    });
  </script>
</body>
</html>
