<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <title>ROADBOOK READER - Select File</title>
  
  <link rel="stylesheet" href="src/style.css">
  
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.min.js"></script>
</head>
<body class="page-landing">

  <div class="offroad-bg-overlay"></div>

  <main class="offroad-card">
    <div class="offroad-badge">OFF-ROAD NAVIGATION</div>
    
    <h1 class="main-title">
      <span class="title-top">ROADBOOK</span>
      <span class="title-bottom">READER</span>
    </h1>
    
    <p class="subtitle">Carica PDF o Immagine (PNG, JPG, HEIC) o la traccia GPS ed inizia il viaggio.</p>

    <div class="upload-container" style="display: flex; flex-direction: column; gap: 15px; max-width: 400px; margin: 0 auto; text-align: center;">
      
      <h2>Seleziona la Modalità di Navigazione</h2>

      <label for="file-upload-roadbook" class="btn-upload" style="background-color: #ff9800; padding: 15px; border-radius: 8px; color: #fff; cursor: pointer; font-weight: bold;">
        📄 Carica Roadbook (PDF / JPG / HEIC)
      </label>
      <input 
        id="file-upload-roadbook" 
        type="file" 
        accept="application/pdf, image/jpeg, image/png, .heic" 
        style="display:none;" 
        onchange="loadRoadbook(event)" 
      />

      <label for="file-upload-gpx" class="btn-upload" style="background-color: #00e676; padding: 15px; border-radius: 8px; color: #000; cursor: pointer; font-weight: bold;">
        🗺️ Carica Traccia GPS (GPX / OsmAnd)
      </label>
      <input 
        id="file-upload-gpx" 
        type="file" 
        accept=".gpx, application/gpx+xml" 
        style="display:none;" 
        onchange="loadGPXFile(event)" 
      />

      <p id="upload-status" style="margin-top: 10px; font-size: 0.9rem; color: #ccc;"></p>
    </div>

    <div class="offroad-decorations">
      <span>TRIP METER</span>
      <span>•</span>
      <span>GPS TRACK</span>
      <span>•</span>
      <span>AUTO-ADVANCE</span>
    </div>

    <br>

    <footer class="footer-credit">
      Powered by Angelo Martelli
    </footer>
  </main>

  <script src="src/app.js"></script>
</body>
</html>
